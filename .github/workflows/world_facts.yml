name: World Facts Shorts — 8x Daily

on:
  # 8 uploads spread evenly across 24 hours (every 3 hours)
  schedule:
    - cron: "0 0 * * *"    # 00:00 UTC
    - cron: "0 3 * * *"    # 03:00 UTC
    - cron: "0 6 * * *"    # 06:00 UTC
    - cron: "0 9 * * *"    # 09:00 UTC
    - cron: "0 12 * * *"   # 12:00 UTC
    - cron: "0 15 * * *"   # 15:00 UTC
    - cron: "0 18 * * *"   # 18:00 UTC
    - cron: "0 21 * * *"   # 21:00 UTC
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional fact topic hint (leave blank for random)"
        required: false
        default: ""

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_MODEL: openai/gpt-oss-120b
  DEAPI_TOKEN: ${{ secrets.DEAPI_TOKEN }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET_VALUE: ${{ secrets.YT_CLIENT_SECRET_VALUE }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
  EDGE_TTS_VOICE: "en-US-GuyNeural"

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      # Restore fact history from previous runs (prevents repeating the same topic)
      - name: Restore history cache
        uses: actions/cache/restore@v4
        with:
          path: output/history/
          key: world-facts-history-${{ github.run_id }}
          restore-keys: |
            world-facts-history-

      - name: Generate & upload World Facts Short
        run: |
          TOPIC="${{ github.event.inputs.topic || '' }}"
          if [ -n "$TOPIC" ]; then
            python scripts/run_short.py --channel world_facts --topic "$TOPIC" --upload --privacy public
          else
            python scripts/run_short.py --channel world_facts --upload --privacy public
          fi

      # Save history so future runs know which facts have already been covered
      - name: Save history cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: output/history/
          key: world-facts-history-${{ github.run_id }}
